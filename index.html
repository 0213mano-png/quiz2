<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>主任技師等任用候補者選考 確認テスト後半</title>
<style>
:root{
  --bg:#f4f6fa;--card:#fff;--border:#e3e7ef;--text:#111827;--muted:#64748b;
  --ok:#15803d;--okbg:#f0fdf4;--ng:#dc2626;--ngbg:#fff1f2;--accent:#3730a3;--accent2:#4f46e5;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  line-height:1.68;margin:0;background:var(--bg);color:var(--text);
  padding-bottom:calc(88px + env(safe-area-inset-bottom));
}
button,input{font:inherit}
button{touch-action:manipulation}
.wrap{width:min(100%,900px);margin:0 auto;padding-left:16px;padding-right:16px}
.topbar{
  background:rgba(255,255,255,.96);position:sticky;top:0;z-index:20;
  border-bottom:1px solid var(--border);backdrop-filter:blur(10px)
}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:8px}.header-actions{display:flex;gap:8px;align-items:center}.icon-button{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.brand h1{font-size:17px;line-height:1.3;margin:0;font-weight:800}
.brand .sub{font-size:12px;color:var(--muted);margin-top:2px}
.icon-button,.ghost-button{
  border:1px solid var(--border);background:#fff;color:#1f2937;border-radius:12px;
  min-height:42px;padding:8px 12px;font-weight:700;cursor:pointer
}
.progress-wrap{padding-bottom:8px}
.progress-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:700;margin-bottom:6px}
.progress-row span:last-child{color:var(--muted);font-weight:600}
.progress-track{height:7px;background:#e9edf5;border-radius:999px;overflow:hidden}
.progress-bar{height:100%;width:0;background:var(--accent2);border-radius:999px;transition:width .2s ease}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:2px;padding-bottom:10px}
.shuffle-toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;cursor:pointer;user-select:none}
.shuffle-toggle input{width:19px;height:19px;cursor:pointer}
#app{padding-top:12px;padding-bottom:18px}
.card{
  display:none;background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:18px 16px;box-shadow:0 4px 18px rgba(15,23,42,.05);margin:0
}
.card.active{display:block}
.question-chip{
  display:inline-flex;align-items:center;border-radius:999px;background:#eef2ff;color:#3730a3;
  padding:4px 10px;font-size:12px;font-weight:800;margin-bottom:10px
}
.title{font-weight:750;font-size:16px;line-height:1.75;margin-bottom:16px;white-space:normal;overflow-wrap:anywhere}
.question-options{display:grid;gap:10px}
.opt{
  display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--border);
  border-radius:14px;background:#fff;cursor:pointer;min-height:56px;transition:.12s ease;
  -webkit-tap-highlight-color:transparent
}
.opt:active{transform:scale(.995)}
.opt input{margin:4px 0 0;width:20px;height:20px;flex:0 0 auto;accent-color:var(--accent2)}
.opt .option-body{font-size:15px;line-height:1.7;overflow-wrap:anywhere;word-break:normal;line-break:strict;white-space:normal}
.option-label{font-weight:800;margin-right:6px}
.opt:has(input:checked){border-color:#818cf8;background:#f5f7ff;box-shadow:0 0 0 1px rgba(99,102,241,.08)}
.opt.correct.sel{border-color:#22c55e;background:var(--okbg)}
.opt.incorrect.sel{border-color:#ef4444;background:var(--ngbg)}
.opt.correct-answer{border-color:#86efac;background:#f7fff9}
.question-reset-row{display:flex;justify-content:flex-end;margin-top:12px}
.question-reset{border:0;background:transparent;color:var(--muted);padding:8px 4px;font-size:13px;font-weight:700;cursor:pointer}
.score{font-weight:850;font-size:17px;margin-top:16px;padding:12px 14px;border-radius:12px;background:#f8fafc}
.explain-details{margin-top:10px;border:1px solid var(--border);border-radius:14px;background:#f8fafc;overflow:hidden}
.explain-details summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:800;font-size:14px}
.explain-details summary::-webkit-details-marker{display:none}
.explain-details summary::after{content:"＋";float:right;color:var(--muted);font-size:18px;line-height:1}
.explain-details[open] summary::after{content:"−"}
.explain{font-size:14px;color:#334155;padding:0 14px 14px;overflow-wrap:anywhere}
.answerline{margin:0 0 10px;font-size:15px;font-weight:700}
.diffblock{margin:12px 0;padding-top:10px;border-top:1px dashed #cbd5e1}
.difflabel{font-weight:800;margin-bottom:5px}
.diffline{margin-top:5px}
.correctline{margin-top:6px;color:#1f2937}
.ins{color:#dc2626;font-weight:800}
del{color:#64748b;text-decoration-color:#ef4444;text-decoration-thickness:2px}
.footer{color:#6b7280;font-size:12px;margin:16px 2px 0}
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.98);
  border-top:1px solid var(--border);
  padding:10px max(12px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right));
  box-shadow:0 -5px 20px rgba(15,23,42,.07)
}
.bottom-nav-inner{width:min(100%,900px);margin:0 auto;display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:8px}
.nav-btn{min-height:48px;border-radius:13px;border:1px solid var(--border);font-weight:800;cursor:pointer;background:#fff;color:#1f2937}
.nav-btn.primary{background:#111827;color:#fff;border-color:#111827}
.nav-btn:disabled{opacity:.38;cursor:default}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.46);display:none;align-items:flex-end}
.overlay.open{display:flex}
.sheet{
  width:100%;max-height:82vh;background:#fff;border-radius:22px 22px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom));overflow:auto;
  box-shadow:0 -12px 34px rgba(15,23,42,.18)
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:-16px;background:#fff;padding:8px 0 12px;z-index:2}
.sheet-head h2{font-size:17px;margin:0}
.question-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.qjump{aspect-ratio:1;border-radius:12px;border:1px solid var(--border);background:#fff;color:#1f2937;font-weight:800;cursor:pointer}
.qjump.answered{background:#eef2ff;border-color:#c7d2fe}
.qjump.correct{background:#ecfdf3;border-color:#86efac;color:#166534}
.qjump.wrong{background:#fff1f2;border-color:#fda4af;color:#9f1239}
.qjump.current{outline:2px solid var(--accent2);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);margin:12px 0}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;border:1px solid var(--border);background:#fff}
.dot.answered{background:#eef2ff;border-color:#c7d2fe}
.dot.correct{background:#ecfdf3;border-color:#86efac}
.dot.wrong{background:#fff1f2;border-color:#fda4af}
@media(min-width:700px){
  .brand h1{font-size:20px}.card{padding:26px 28px}.title{font-size:18px}.opt .option-body{font-size:16px}
  .question-grid{grid-template-columns:repeat(10,1fr)}
  .sheet{width:min(760px,calc(100% - 40px));margin:0 auto 20px;border-radius:22px;max-height:75vh}
  .overlay{align-items:center}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap header-row">
    <div class="brand"><h1>主任技師等任用候補者選考</h1><div class="sub">確認テスト後半 2026</div></div>
    <div class="header-actions"><a class="icon-button" href="https://0213mano-png.github.io/quiz1/">テスト一覧</a><button type="button" class="icon-button" id="questionListBtn">問題一覧</button></div>
  </div>
  <div class="wrap progress-wrap">
    <div class="progress-row"><span id="progressText">問 1 / 29</span><span id="answeredText">回答 0 / 29</span></div>
    <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
  </div>
  <div class="wrap toolbar">
    <label class="shuffle-toggle"><input type="checkbox" id="globalShuffle"> 選択肢をシャッフル</label>
    <button type="button" class="ghost-button" id="resetAllBtn">全てリセット</button>
  </div>
</header>

<main class="wrap" id="app"></main>

<div class="bottom-nav">
  <div class="bottom-nav-inner">
    <button type="button" class="nav-btn" id="prevBtn">← 前へ</button>
    <button type="button" class="nav-btn primary" id="gradeBtn">採点</button>
    <button type="button" class="nav-btn" id="nextBtn">次へ →</button>
  </div>
</div>

<div class="overlay" id="questionOverlay" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="questionSheetTitle">
    <div class="sheet-head">
      <h2 id="questionSheetTitle">問題一覧</h2>
      <button type="button" class="icon-button" id="closeQuestionListBtn">閉じる</button>
    </div>
    <div class="legend">
      <span><i class="dot"></i>未回答</span><span><i class="dot answered"></i>回答済み</span>
      <span><i class="dot correct"></i>正解</span><span><i class="dot wrong"></i>不正解</span>
    </div>
    <div class="question-grid" id="questionGrid"></div>
  </div>
</div>

<script src="quiz-data-1.js?v=20260922-quiz2"></script>
<script src="quiz-data-2.js?v=20260922-quiz2"></script>
<script src="quiz-data-3.js?v=20260922-quiz2"></script>
<script src="quiz-data-4.js?v=20260922-quiz2"></script>
<script src="quiz-data-5.js?v=20260922-quiz2"></script>
<script>
const DATA=window.QUIZ_DATA||[];
let currentIndex=0;
const state=DATA.map(()=>({graded:false,correct:null}));

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c));}
function getCard(index){return document.querySelector('.card[data-index="'+index+'"]');}
function getCurrentCard(){return getCard(currentIndex);}
function clearFeedback(card,form){
  form.querySelectorAll('.opt').forEach(x=>x.classList.remove('correct','incorrect','sel','correct-answer'));
  card.querySelectorAll('.score,.explain-details').forEach(x=>x.remove());
}
function hasAnswer(form){return form.querySelectorAll('input[type="checkbox"]:checked').length>0;}

function render(){
  const app=document.getElementById('app'); app.innerHTML='';
  DATA.forEach((q,index)=>{
    const card=document.createElement('section'); card.className='card'; card.dataset.index=index; card.dataset.qid=q.id;
    const chip=document.createElement('div'); chip.className='question-chip'; chip.textContent='問 '+(index+1)+' / '+DATA.length; card.appendChild(chip);
    const h=document.createElement('div'); h.className='title'; h.textContent=q.title; card.appendChild(h);
    const form=document.createElement('div'); form.className='question-options';

    q.options.forEach((o,idx)=>{
      const label=document.createElement('label'); label.className='opt'; label.dataset.originalIndex=idx;
      const cb=document.createElement('input'); cb.type='checkbox'; cb.name='q_'+q.id; cb.value=idx;
      cb.addEventListener('change',()=>{
        state[index].graded=false; state[index].correct=null; clearFeedback(card,form); updateUI();
      });
      const body=document.createElement('div'); body.className='option-body';
      const n=document.createElement('span'); n.className='option-label'; n.textContent=o.label+'.';
      const t=document.createElement('span'); t.className='option-text'; t.textContent=o.text;
      body.append(n,t); label.append(cb,body); form.appendChild(label);
    });
    card.appendChild(form);

    const resetRow=document.createElement('div'); resetRow.className='question-reset-row';
    const reset=document.createElement('button'); reset.type='button'; reset.className='question-reset'; reset.textContent='この問題をリセット';
    reset.onclick=()=>resetCard(card,form,index); resetRow.appendChild(reset); card.appendChild(resetRow);
    app.appendChild(card);
  });
  const note=document.createElement('div'); note.className='footer';
  note.textContent='※ 問題文は「確認テスト後半2026」、正答・修正内容は「確認テスト後半_解答2026」を基にしています。';
  app.appendChild(note);
  buildQuestionGrid(); showQuestion(0,false);
}

function gradeCurrent(){
  const q=DATA[currentIndex], card=getCurrentCard(); if(!card)return;
  const form=card.querySelector('.question-options'); clearFeedback(card,form);
  const selected=[...form.querySelectorAll('input[type="checkbox"]:checked')].map(x=>Number(x.value));
  if(selected.length===0){showMessage(card,'⚠️ 選択肢を選んでから採点してください。');return;}
  const selectedSet=new Set(selected);
  const exact=q.options.every((o,idx)=>selectedSet.has(idx)===!!o.correct);

  q.options.forEach((o,idx)=>{
    const opt=form.querySelector('.opt[data-original-index="'+idx+'"]');
    const input=opt.querySelector('input');
    if(input.checked) opt.classList.add(o.correct?'correct':'incorrect','sel');
    if(!exact && o.correct && !input.checked) opt.classList.add('correct-answer');
  });

  showMessage(card,exact?'✅ 正解！':'❌ 不正解');
  addExplanation(card,q);
  state[currentIndex].graded=true; state[currentIndex].correct=exact; updateUI();
  setTimeout(()=>{const r=card.querySelector('.score');if(r)r.scrollIntoView({behavior:'smooth',block:'center'});},40);
}

function showMessage(card,text){
  const s=document.createElement('div'); s.className='score'; s.textContent=text; card.appendChild(s);
}

function addExplanation(card,q){
  const details=document.createElement('details'); details.className='explain-details'; details.open=true;
  const summary=document.createElement('summary'); summary.textContent='解説を開く／閉じる';
  const exp=document.createElement('div'); exp.className='explain';
  const correctLabels=q.options.filter(o=>o.correct).map(o=>o.label).join('、');
  const answer=document.createElement('div'); answer.className='answerline'; answer.textContent='正解：'+correctLabels; exp.appendChild(answer);

  let count=0;
  q.options.forEach(o=>{
    if(!o.explanation_html)return;
    count++;
    const block=document.createElement('div'); block.className='diffblock';
    const head=document.createElement('div'); head.className='difflabel'; head.textContent='選択肢 '+o.label;
    const body=document.createElement('div'); body.innerHTML=o.explanation_html;
    block.append(head,body); exp.appendChild(block);
  });
  if(count===0){
    const p=document.createElement('div');
    p.textContent='解答資料では上記の選択肢が解答として示されています。';
    exp.appendChild(p);
  }
  details.append(summary,exp); card.appendChild(details);
}

function shuffledCopy(items){
  const a=[...items];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function setQuestionShuffle(card,enabled){
  const form=card.querySelector('.question-options'); if(!form)return;
  let items=[...form.querySelectorAll('.opt')];
  if(enabled) items=shuffledCopy(items); else items.sort((a,b)=>Number(a.dataset.originalIndex)-Number(b.dataset.originalIndex));
  items.forEach(item=>form.appendChild(item));
  form.querySelectorAll('.option-label').forEach(x=>x.style.display=enabled?'none':'inline');
}
function setGlobalShuffle(enabled){DATA.forEach((q,index)=>{const card=getCard(index);if(card)setQuestionShuffle(card,enabled);});}
function resetCard(card,form,index){
  form.querySelectorAll('input').forEach(x=>x.checked=false); clearFeedback(card,form);
  state[index].graded=false; state[index].correct=null; updateUI();
}
function resetAll(){
  DATA.forEach((q,index)=>{const card=getCard(index);if(card)resetCard(card,card.querySelector('.question-options'),index);});
  showQuestion(0,true);
}
function getAnsweredCount(){
  return DATA.reduce((n,q,index)=>{const card=getCard(index);return n+(card&&hasAnswer(card.querySelector('.question-options'))?1:0);},0);
}
function showQuestion(index,scrollTop=true){
  if(index<0||index>=DATA.length)return;
  currentIndex=index;
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
  const card=getCurrentCard(); if(card)card.classList.add('active');
  if(scrollTop)window.scrollTo({top:0,behavior:'smooth'}); updateUI();
}
function updateUI(){
  const pct=DATA.length?((currentIndex+1)/DATA.length)*100:0;
  document.getElementById('progressText').textContent='問 '+(currentIndex+1)+' / '+DATA.length;
  document.getElementById('answeredText').textContent='回答 '+getAnsweredCount()+' / '+DATA.length;
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('prevBtn').disabled=currentIndex===0;
  document.getElementById('nextBtn').disabled=currentIndex===DATA.length-1;
  document.querySelectorAll('.qjump').forEach((btn,index)=>{
    btn.classList.remove('answered','correct','wrong','current');
    if(index===currentIndex)btn.classList.add('current');
    const card=getCard(index);
    if(state[index].graded)btn.classList.add(state[index].correct?'correct':'wrong');
    else if(card&&hasAnswer(card.querySelector('.question-options')))btn.classList.add('answered');
  });
}
function buildQuestionGrid(){
  const grid=document.getElementById('questionGrid'); grid.innerHTML='';
  DATA.forEach((q,index)=>{
    const b=document.createElement('button'); b.type='button'; b.className='qjump'; b.textContent=index+1;
    b.onclick=()=>{closeQuestionList();showQuestion(index,true);}; grid.appendChild(b);
  });
}
function openQuestionList(){
  const o=document.getElementById('questionOverlay'); o.classList.add('open'); o.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden'; updateUI();
}
function closeQuestionList(){
  const o=document.getElementById('questionOverlay'); o.classList.remove('open'); o.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
}

render();
document.getElementById('prevBtn').onclick=()=>showQuestion(currentIndex-1,true);
document.getElementById('nextBtn').onclick=()=>showQuestion(currentIndex+1,true);
document.getElementById('gradeBtn').onclick=gradeCurrent;
document.getElementById('questionListBtn').onclick=openQuestionList;
document.getElementById('closeQuestionListBtn').onclick=closeQuestionList;
document.getElementById('questionOverlay').onclick=function(e){if(e.target===this)closeQuestionList();};
document.getElementById('globalShuffle').onchange=function(){setGlobalShuffle(this.checked);};
document.getElementById('resetAllBtn').onclick=()=>{if(confirm('全29問の回答をリセットしますか？'))resetAll();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeQuestionList();});
</script>
</body>
</html>
